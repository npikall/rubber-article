# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: Publish to Typst Universe fork

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # fork of typst/packages that REGISTRY_TOKEN has push access to
  FORK_URL: https://github.com/npikall/typst-packages

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install just
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: just

      - name: Setup typst
        uses: typst-community/setup-typst@00ad6338f0b34724ea002136bfb701a6c18585b0 # v5.3.2
        with:
          typst-version: latest

      - name: Setup Go and gotpm
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: false
      - run: go install github.com/npikall/gotpm@latest

      - name: Configure git for the fork
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          git config --global user.name "$(git log -1 --pretty=format:'%an')"
          git config --global user.email "$(git log -1 --pretty=format:'%ae')"
          git config --global url."https://x-access-token:${REGISTRY_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Configure gotpm
        run: gotpm config set fork.url "${FORK_URL}"

      # runs the pre-publish hook (`just thumbnail`), commits the package to the
      # `<name>-<version>` branch of the fork and pushes it
      - name: Publish
        run: gotpm publish --verbose
